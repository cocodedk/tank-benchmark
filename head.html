<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- SEO keywords:
     primary:   AI coding loop benchmark
     secondary: AI build setup cost, three.js game benchmark, coding loop model choice
     intent:    informational
-->
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="robots" content="index, follow">
<meta name="author" content="Babak Bandpey">
<link rel="canonical" href="{{canonical}}">
<link rel="alternate" hreflang="en" href="{{origin}}/">
<link rel="alternate" hreflang="fa" href="{{origin}}/fa/">
<link rel="alternate" hreflang="x-default" href="{{origin}}/">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Tank Duel Benchmark">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{origin}}/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{og_alt}}">
<meta property="og:locale" content="{{og_locale}}">
<meta property="og:locale:alternate" content="{{og_locale_alt}}">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{origin}}/og.png">
<meta name="twitter:image:alt" content="{{og_alt}}">

<link rel="icon" type="image/svg+xml" href="{{root}}favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="{{fonts}}">
<link rel="stylesheet" href="{{root}}styles.css">
<link rel="stylesheet" href="https://brand.cocode.dk/v1.css">
<script type="module" src="https://brand.cocode.dk/v1.js"></script>
<script type="application/ld+json">
{{jsonld}}
</script>
</head>
