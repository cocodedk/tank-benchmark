<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tank Duel</title>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #20252b; font: 14px sans-serif; color: #fff; }
  #game { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; top: 8px; left: 0; right: 0; text-align: center; pointer-events: none; text-shadow: 0 1px 2px #000; }
  .bars { display: flex; justify-content: center; gap: 24px; }
  .bar { width: 200px; text-align: left; }
  .track { height: 12px; background: #000a; border: 1px solid #fff8; }
  .fill { height: 100%; width: 100%; }
  #hp-player { background: #2f6fe0; }
  #hp-computer { background: #d6392f; }
  #banner { position: fixed; top: 40%; left: 0; right: 0; text-align: center; font-size: 48px; font-weight: bold; text-shadow: 0 2px 6px #000; }
  #banner[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="bars">
    <div class="bar">You<div class="track"><div class="fill" id="hp-player"></div></div></div>
    <div>Score <span id="score">0 : 0</span> · Round <span id="round">1</span></div>
    <div class="bar">Computer<div class="track"><div class="fill" id="hp-computer"></div></div></div>
  </div>
  <div>W/↑ forward · S/↓ back · A/← D/→ turn · Space fire</div>
</div>
<div id="banner" hidden></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
