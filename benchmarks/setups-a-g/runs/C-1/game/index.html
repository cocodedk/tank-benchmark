<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tank Duel</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font: 14px/1.3 sans-serif; color: #fff; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; top: 0; left: 0; right: 0; padding: 8px 12px; pointer-events: none; text-shadow: 0 1px 2px #000; }
  #hud .row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  #hud .name { width: 80px; }
  #hud .bar { width: 160px; height: 12px; background: #0008; border: 1px solid #fff8; }
  #hud .bar div { height: 100%; width: 100%; }
  #banner { position: fixed; top: 40%; left: 0; right: 0; text-align: center; font-size: 40px; font-weight: bold; text-shadow: 0 2px 6px #000; display: none; }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"></div>
<div id="banner"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
